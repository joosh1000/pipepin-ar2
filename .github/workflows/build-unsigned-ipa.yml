name: Build PipePin iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project PipePinAR.xcodeproj \
            -scheme PipePinAR \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build 2>&1 | tee xcodebuild.log

      - name: Show compiler diagnostics if build failed
        if: failure()
        run: |
          echo '===== COMPILER ERRORS ====='
          grep -nE 'error:|warning:' xcodebuild.log | tail -120 || true

      - name: Upload build log if build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PipePinAR-0.3-build-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Debug-iphoneos/PipePinAR.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry PipePinAR-0.3-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PipePinAR-0.3-iPhone-build
          path: PipePinAR-0.3-unsigned.ipa
          retention-days: 7
