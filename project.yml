name: PipePinAR
options:
  bundleIdPrefix: com.builttosolve
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.builttosolve.pipepinar
    MARKETING_VERSION: 0.2
    CURRENT_PROJECT_VERSION: 2
    INFOPLIST_KEY_CFBundleDisplayName: PipePin
    INFOPLIST_KEY_NSCameraUsageDescription: PipePin uses the camera, ARKit and LiDAR where available to map spaces and place real-world service pins.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PipePinAR:
    type: application
    platform: iOS
    sources:
      - PipePinAR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
