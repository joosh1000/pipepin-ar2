name: PipePinAR
options:
  bundleIdPrefix: com.builttosolve
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.builttosolve.pipepinar
    INFOPLIST_KEY_NSCameraUsageDescription: PipePin AR uses the camera to place and relocate service markers in the real world.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PipePinAR:
    type: application
    platform: iOS
    sources:
      - PipePinAR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
